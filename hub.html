<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSCN WMF — Hub de Links</title>
<style>
  :root {
    --navy-900: #10151f;
    --navy-800: #171f2e;
    --navy-700: #212b3d;
    --gray-300: #c7c7c7;
    --gray-500: #98a2b3;
    --white: #ffffff;
    --red: #c0142a;
    --red-dark: #7d0c16;
    --blue: #1f5f9c;
    --blue-dark: #123a63;
    --amber: #c98a1f;
    --amber-dark: #7a5410;
    --purple: #6a4c93;
    --purple-dark: #402d5a;
    --teal: #1c8577;
    --teal-dark: #0f4d44;
    --radius: 14px;
    --shadow: 0 6px 20px rgba(0,0,0,.35);
    --shadow-hover: 0 14px 34px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--white);
    background:
      radial-gradient(ellipse 900px 500px at 12% -10%, rgba(192,20,42,.35), transparent 60%),
      radial-gradient(ellipse 800px 600px at 100% 0%, rgba(31,95,156,.30), transparent 55%),
      linear-gradient(180deg, var(--navy-900) 0%, #0b0e15 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  /* padrao de fundo sutil (grade de pontos), sem depender de imagem externa */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 26px 26px;
    pointer-events: none;
    z-index: 0;
  }
  header {
    position: relative;
    z-index: 1;
    padding: 48px 28px 34px;
    text-align: center;
  }
  header .eyebrow {
    font-size: 11px;
    letter-spacing: .18em;
    color: var(--gray-500);
    text-transform: uppercase;
    font-weight: 700;
  }
  header h1 {
    margin: 8px 0 4px;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -.01em;
    background: linear-gradient(90deg, #ffffff, #d8dee9);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header .subtitle { color: var(--gray-500); font-size: 14px; margin-bottom: 22px; }
  #searchBox {
    padding: 13px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.06);
    color: var(--white);
    width: min(420px, 90vw);
    font-size: 14px;
    outline: none;
    backdrop-filter: blur(6px);
  }
  #searchBox::placeholder { color: var(--gray-500); }
  #searchBox:focus { border-color: rgba(255,255,255,.4); }

  main { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 10px 24px 70px; }
  .section { margin-bottom: 40px; }
  .section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--gray-500);
    font-weight: 700;
    margin: 0 0 16px 4px;
  }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
  }
  a.card {
    display: block;
    background: var(--navy-700);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.06);
    transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease;
  }
  a.card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-4px);
    border-color: rgba(255,255,255,.18);
  }
  .card-art {
    height: 108px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .card-art::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.22), transparent 55%);
  }
  .card-art svg { width: 40px; height: 40px; position: relative; z-index: 1; stroke: #fff; }
  .card-body { padding: 16px 16px 18px; }
  .card-tag {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--gray-500);
    margin-bottom: 5px;
  }
  .card-title { font-size: 15px; font-weight: 700; color: var(--white); line-height: 1.3; }
  .empty-state { color: var(--gray-500); font-size: 13px; padding: 30px 0; text-align: center; display: none; }
  footer { position: relative; z-index: 1; text-align: center; font-size: 12px; color: var(--gray-500); padding: 10px 20px 40px; }

  @media (max-width: 480px) {
    header h1 { font-size: 26px; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">CNH INDUSTRIAL — WMF Brasil / CSCN</div>
  <h1>Hub de Links</h1>
  <div class="subtitle">Dashboards, portais e relatorios em um so lugar</div>
  <input type="text" id="searchBox" placeholder="Buscar...">
</header>

<main>
  <div class="section" id="sectionApps">
    <h2>Apps CSCN WMF</h2>
    <div class="card-grid" id="gridApps"></div>
  </div>

  <div class="section" id="sectionPowerBI">
    <h2>Power BI</h2>
    <div class="card-grid" id="gridPowerBI"></div>
  </div>

  <div class="empty-state" id="emptyState">Nenhum link encontrado.</div>
</main>

<footer>CSCN WMF — Hub de links internos.</footer>

<script>
// Icones inline (estilo feather-icons, stroke, sem dependencia externa)
const ICONS = {
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="10"/><line x1="10" y1="20" x2="10" y2="4"/><line x1="16" y1="20" x2="16" y2="14"/><line x1="22" y1="20" x2="22" y2="8"/></svg>',
  fileCheck: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15l2 2 4-4"/></svg>',
  bulb: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2.3h6c0-1.1.4-1.8 1-2.3A7 7 0 0 0 12 2Z"/></svg>',
  gauge: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14 15.5 10.5"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>',
  presentation: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="M7 21l5-5 5 5"/><line x1="12" y1="16" x2="12" y2="21"/></svg>',
  coins: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="M16.71 13.88.7.71-.71.7"/></svg>',
  database: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.7-4 3-9 3s-9-1.3-9-3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/></svg>',
};

const LINKS = [
  {
    group: "apps",
    tag: "Dashboard",
    title: "Dashboard CSCN / CPL",
    url: "https://facubr96-bot.github.io/cscn-wmf-promessas/dashboard_cb_3e.html?planta=3e",
    icon: "chart",
    gradient: "linear-gradient(135deg, #c0142a, #7d0c16)",
  },
  {
    group: "apps",
    tag: "NF-e",
    title: "Conferência Automática de NF-e de Fornecedores",
    url: "https://nfe-validador-dashboard.cscn-wmf.workers.dev/",
    icon: "fileCheck",
    gradient: "linear-gradient(135deg, #1f5f9c, #123a63)",
  },
  {
    group: "powerbi",
    tag: "Power BI",
    title: "Iniciatives Dashboard",
    url: "https://app.powerbi.com/groups/6877bb99-0923-4603-92f5-aa2186761d22/reports/424b81e8-9ad3-4db6-8312-e0079cd3813b/9283f75403ae5255d9b7?experience=power-bi",
    icon: "bulb",
    gradient: "linear-gradient(135deg, #c98a1f, #7a5410)",
  },
  {
    group: "powerbi",
    tag: "Power BI",
    title: "KPI 2",
    url: "https://app.powerbi.com/groups/6877bb99-0923-4603-92f5-aa2186761d22/reports/fa7297ad-9c28-4528-9364-be7fca6d8a83/9fbc1ae0a56a0d66ba94?experience=power-bi",
    icon: "gauge",
    gradient: "linear-gradient(135deg, #2f7d4f, #163f28)",
  },
  {
    group: "powerbi",
    tag: "Power BI",
    title: "Business Review",
    url: "https://app.powerbi.com/groups/6877bb99-0923-4603-92f5-aa2186761d22/reports/1ef64529-4ab8-4fd5-b19c-35ec1dc6f581/c2f2d3b4f44232a6266f?experience=power-bi",
    icon: "presentation",
    gradient: "linear-gradient(135deg, #6a4c93, #402d5a)",
  },
  {
    group: "powerbi",
    tag: "Power BI",
    title: "Custos WMF",
    url: "https://app.powerbi.com/groups/6877bb99-0923-4603-92f5-aa2186761d22/reports/cef9e4c0-021e-45ad-9d30-9251c28c7fa5/2bb0b33d08ae94cd7c7f?experience=power-bi",
    icon: "coins",
    gradient: "linear-gradient(135deg, #c98a1f, #8a5f10)",
  },
  {
    group: "powerbi",
    tag: "Power BI",
    title: "DMS",
    url: "https://app.powerbi.com/groups/6877bb99-0923-4603-92f5-aa2186761d22/reports/bbd3c6d6-e828-4e95-98aa-ca914b4abd6f/4802ede2e5d53010d0c5?experience=power-bi",
    icon: "database",
    gradient: "linear-gradient(135deg, #1c8577, #0f4d44)",
  },
];

function cardHtml(link) {
  return `
    <a class="card" href="${link.url}" target="_blank" rel="noopener">
      <div class="card-art" style="background:${link.gradient}">${ICONS[link.icon] || ""}</div>
      <div class="card-body">
        <div class="card-tag">${link.tag}</div>
        <div class="card-title">${link.title}</div>
      </div>
    </a>`;
}

function render(filter) {
  const q = (filter || "").trim().toLowerCase();
  const apps = LINKS.filter(l => l.group === "apps" && (!q || l.title.toLowerCase().includes(q)));
  const bi = LINKS.filter(l => l.group === "powerbi" && (!q || l.title.toLowerCase().includes(q)));

  document.getElementById("gridApps").innerHTML = apps.map(cardHtml).join("");
  document.getElementById("gridPowerBI").innerHTML = bi.map(cardHtml).join("");

  document.getElementById("sectionApps").style.display = apps.length ? "" : "none";
  document.getElementById("sectionPowerBI").style.display = bi.length ? "" : "none";
  document.getElementById("emptyState").style.display = (apps.length === 0 && bi.length === 0) ? "block" : "none";
}

document.getElementById("searchBox").oninput = (e) => render(e.target.value);
render("");
</script>

</body>
</html>
